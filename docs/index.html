/* ---------- Grundlagen ---------- */
* { box-sizing: border-box; }

}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

/* ---------- Rahmen ---------- */

}

/* ---------- Knöpfe & Eingaben ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid transparent;
  background: var(--panel-2); color: var(--ink); font-weight: 580; font-size: 14px; white-space: nowrap;
}
.btn:hover { background: color-mix(in srgb, var(--panel-2) 80%, var(--ink) 6%); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:active:not(:disabled), .icon-btn:active, .quick button:active, .fab:active, .ios-cta:active, .row.clickable:active, .choice:active { transform: scale(.97); }

.btn-primary { background: var(--ink); color: var(--on-ink); }

/* ---------- Karten ---------- */

  white-space: nowrap; font-variant-numeric: tabular-nums;

.hero-value .cur-sym { font-size: .5em; font-weight: 600; margin-left: .12em; color: var(--ink-2); }
.hero-delta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; font-size: 13.5px; color: var(--ink-3); }
.chg { display: inline-flex; align-items: center; gap: 3px; height: 26px; padding: 0 9px 0 6px; border-radius: 999px; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--panel-2); color: var(--ink-2); }
.chg svg { width: 15px; height: 15px; stroke-width: 2.2; }
.chg.pos { color: var(--pos); background: color-mix(in srgb, var(--st-good) 12%, var(--panel)); }
.chg.neg { color: var(--neg); background: color-mix(in srgb, var(--st-crit) 11%, var(--panel)); }
.hero .view-switch { margin-top: 18px; }
.hero .chart-area { margin-top: 14px; }
.chart-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-top: 12px; }
@media (max-width: 899px) { .hero { padding: 18px 16px 14px; } .hero .view-switch { margin-top: 16px; } }

.hero-goal { display: grid; grid-template-columns: auto minmax(60px, 200px) auto; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--ink-2); text-decoration: none; }
.hero-goal .hg-l { display: inline-flex; align-items: center; gap: 6px; font-weight: 580; color: var(--ink); min-width: 0; }
.hero-goal .hg-l svg { color: var(--ink-3); }
.hero-goal .hg-r { font-variant-numeric: tabular-nums; font-weight: 620; color: var(--ink); }
@media (max-width: 560px) { .hero-goal { grid-template-columns: minmax(0, 1fr) auto; } .hero-goal .meter { grid-column: 1 / -1; grid-row: 2; } }

/* Kurse */
.quotes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.quote { padding: 12px 14px; border-radius: 14px; background: var(--panel-2); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.quote .pair { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 560; color: var(--ink-2); }
.quote .px { font-size: 19px; font-weight: 640; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.quote .ch { font-size: 12.5px; font-weight: 560; font-variant-numeric: tabular-nums; }
.quotes-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; min-width: 0; }

/* Schnellaktionen */
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.quick button {
  display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 13px 4px 11px; border-radius: 16px;
  border: 1px solid var(--card-edge); background: var(--panel); color: var(--ink); font-size: 12.5px; font-weight: 580; min-width: 0;
  box-shadow: var(--shadow-sm); -webkit-touch-callout: none;
}
.quick button .qi { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); }
.quick button svg { width: 19px; height: 19px; stroke-width: 1.9; }
.quick button span.ql { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Währungs-Symbole */
.cur {
  display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-weight: 520; font-size: 10.5px;
  letter-spacing: .04em; padding: 3px 7px 3px 6px; border-radius: 999px; background: var(--panel-2); color: var(--ink-2); line-height: 1; white-space: nowrap;
}
.cur::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--ink-3)); }
.tag { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; padding: 3px 7px; border-radius: 999px; background: var(--panel-2); color: var(--ink-3); line-height: 1; white-space: nowrap; }
.avatar { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--c, var(--ink-2)); background: color-mix(in srgb, var(--c, var(--ink-3)) 13%, var(--panel)); }
.avatar svg { width: 20px; height: 20px; stroke-width: 1.9; }

/* ---------- Listen ---------- */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.rows > .row:first-child, .rows > :first-child .row:first-child { border-top: 0; }
.row .t { font-weight: 580; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; overflow-wrap: anywhere; letter-spacing: -0.01em; }
.row .sub { font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.row .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; letter-spacing: -0.01em; }
.row .amt .sub { font-weight: 450; }
.row-actions { display: flex; gap: 2px; justify-content: flex-end; }
.row.clickable { cursor: pointer; -webkit-touch-callout: none; }
.row.clickable:hover { background: var(--panel-2); box-shadow: -10px 0 0 var(--panel-2), 10px 0 0 var(--panel-2); border-radius: 2px; }
.row.clickable:focus-visible { outline-offset: 0; }
.row.with-av { grid-template-columns: 38px minmax(0, 1fr) auto; column-gap: 12px; }

.group { margin-top: 16px; }
.group:first-child { margin-top: 0; }
.group-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 6px; flex-wrap: wrap; }
.group-h .gt { display: flex; align-items: center; gap: 8px; font-weight: 620; font-size: 13px; color: var(--ink-2); }
.group-h .gt .sw { width: 8px; height: 8px; border-radius: 50%; }
.group-h .gv { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-3); text-align: right; }
.group-h .gv b { color: var(--ink-2); font-weight: 600; }

.acc-row { grid-template-columns: 38px minmax(0, 1fr) auto auto; column-gap: 12px; }
.acc-row .bal { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.acc-row .bal .n { font-weight: 620; letter-spacing: -0.01em; }
.acc-row .bal .e { font-size: 13px; color: var(--ink-3); }
@media (max-width: 560px) { .acc-row { grid-template-columns: 38px minmax(0, 1fr) auto; } .acc-row .row-actions { grid-column: 2 / -1; justify-content: flex-start; margin-left: -8px; } }

.day { margin-top: 18px; }
.day:first-child { margin-top: 0; }
.day-h { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding-bottom: 4px; }
.tx-row { grid-template-columns: 38px minmax(0, 1fr) auto; column-gap: 12px; }
.glyph { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--panel-2); color: var(--ink-2); }
.glyph.in { color: var(--pos); background: color-mix(in srgb, var(--st-good) 12%, var(--panel)); }
.glyph svg { width: 18px; height: 18px; stroke-width: 1.9; }

.empty { padding: 18px 0 6px; color: var(--ink-2); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty h3 { font-weight: 640; font-size: 16px; color: var(--ink); letter-spacing: -0.02em; }
.empty p { margin: 0; max-width: 56ch; font-size: 14px; }

.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap;
  padding: 12px 14px; border-radius: 16px; margin-bottom: 14px; font-size: 13.5px;
  background: var(--panel); border: 1px solid var(--card-edge); box-shadow: var(--shadow-sm);
}
.banner .b-txt { display: flex; gap: 10px; align-items: flex-start; min-width: 0; max-width: 72ch; }
.banner .b-txt svg { margin-top: 1px; color: var(--ink-3); }
.banner .b-act { display: flex; gap: 6px; flex-wrap: wrap; }
.banner.warn { border-color: color-mix(in srgb, var(--st-warn) 55%, var(--line)); background: color-mix(in srgb, var(--st-warn) 8%, var(--panel)); }
.banner.warn .b-txt svg { color: var(--warn); }
.banner.accent { border: 0; color: #fff; background: linear-gradient(120deg, #1d2a5c 0%, #0f5a4c 55%, #6b2f17 100%); }
.banner.accent .b-txt svg { color: #fff; }
.banner.accent .btn { background: rgba(255, 255, 255, .16); color: #fff; }
.banner.accent .btn-primary { background: #fff; color: #0b0d12; }

/* ---------- Kennzahlen ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 14px; background: var(--panel-2); min-width: 0; }
.stat .v { font-size: 18px; font-weight: 640; letter-spacing: -0.025em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12.5px; color: var(--ink-3); }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stats-panel { margin-bottom: 14px; }
@media (max-width: 820px) { .stats.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (max-width: 430px) {
  .stats:not(.four) { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .stats:not(.four) .stat { flex-direction: row; justify-content: space-between; align-items: baseline; padding: 10px 12px; }
  .stats:not(.four) .stat .s { font-size: 13.5px; color: var(--ink-2); }
  .stats:not(.four) .stat .v { font-size: 16px; }
}
@media (max-width: 420px) { .stats.four, .stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat .v { font-size: 16px; } }

.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.kv:first-child { border-top: 0; }
.kv > span:first-child { color: var(--ink-2); }
.kv .v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }

/* ---------- Fortschritt ---------- */
.meter { --fill: var(--ink); position: relative; height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--fill) 14%, var(--panel-2)); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: var(--fill); max-width: 100%; }
.meter.warn { --fill: var(--st-warn); }
.meter.crit { --fill: var(--st-crit); }
.meter.good { --fill: var(--st-good); }
.meter .tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--panel); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; height: 24px; padding: 0 9px 0 7px; border-radius: 999px; background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.pill svg { width: 13px; height: 13px; stroke-width: 2.2; }
.pill.good { color: var(--pos); background: color-mix(in srgb, var(--st-good) 12%, var(--panel)); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--st-warn) 15%, var(--panel)); }
.pill.crit { color: var(--neg); background: color-mix(in srgb, var(--st-crit) 11%, var(--panel)); }

.budget { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 9px; }
.budget:first-child { border-top: 0; padding-top: 2px; }
.budget-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.budget-top .name { font-weight: 600; }
.budget-top .vals { font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 13.5px; }
.budget-top .vals b { color: var(--ink); font-weight: 620; }
.budget-foot { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }

.goal { display: flex; flex-direction: column; gap: 12px; }
.goal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.goal .g-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.goal .g-name { font-weight: 640; font-size: 16.5px; letter-spacing: -0.02em; }
.goal .g-val { font-size: 28px; font-weight: 650; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.goal .g-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-3); flex-wrap: wrap; }
.goal.reached { border-color: color-mix(in srgb, var(--st-good) 45%, var(--card-edge)); }
.g-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.g-tags .tag svg { width: 11px; height: 11px; margin-right: 3px; }
.panel-h h2 svg { vertical-align: -3px; margin-right: 4px; }
.faint svg.i.sm { vertical-align: -3px; }

/* ---------- Filter ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.filters .select, .filters .input { height: 38px; font-size: 14px; width: auto; min-width: 0; max-width: 100%; border-radius: 11px; }
.filters .select { background-position: calc(100% - 19px) 16px, calc(100% - 14px) 16px; }
.filters .input { width: 220px; }
.month-nav { display: inline-flex; align-items: center; gap: 4px; padding: 3px; border-radius: 12px; background: var(--panel-2); }
.month-nav .lbl { min-width: 130px; text-align: center; font-weight: 600; font-size: 13.5px; }
@media (max-width: 560px) { .filters .input { width: 100%; } .filters .select { flex: 1 1 140px; } }

/* ---------- Diagramme ---------- */
.chart { position: relative; min-height: 120px; }
.chart svg.plot { display: block; width: 100%; overflow: visible; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.chart .gl { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .base { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
.chart .ax { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .xh { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; shape-rendering: crispEdges; }
.chart-empty { margin: 4px 0 0; max-width: 60ch; color: var(--ink-2); font-size: 14px; padding: 26px 0 18px; }
.tip {
  position: absolute; z-index: 6; pointer-events: none; min-width: 172px; max-width: 240px;
  padding: 10px 12px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12.5px;
}
.tip .d { font-size: 11.5px; font-weight: 560; color: var(--ink-3); margin-bottom: 6px; }
.tip .tr { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 2px 0; }
.tip .tr .k { width: 8px; height: 8px; border-radius: 50%; }
.tip .tr .n { color: var(--ink-2); }
.tip .tr .v { font-weight: 620; font-variant-numeric: tabular-nums; text-align: right; }
.chart-legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.table-wrap { overflow-x: auto; max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { padding: 8px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { position: sticky; top: 0; background: var(--panel-2); font-weight: 600; color: var(--ink-2); font-size: 12px; }

/* Aufteilung (Donut) */
.alloc { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 18px 28px; align-items: center; }
.alloc-donut { position: relative; width: 100%; max-width: 250px; aspect-ratio: 1; justify-self: center; }
.alloc-donut svg { display: block; width: 100%; height: 100%; overflow: visible; }
.alloc-donut .arc { transition: opacity .18s ease; cursor: pointer; }
.alloc-donut.focus .arc { opacity: .28; }
.alloc-donut.focus .arc.on { opacity: 1; }
.alloc-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 0 20%; }
.alloc-center .l { font-size: 12.5px; font-weight: 560; color: var(--ink-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alloc-center .v { font-size: 22px; font-weight: 650; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; }
.alloc-center .s { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; }
.alloc-legend { display: flex; flex-direction: column; min-width: 0; }
.alloc-item { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 8px; margin: 0 -8px; border-radius: 12px; border: 0; background: transparent; text-align: left; width: calc(100% + 16px); color: inherit; }
.alloc-item + .alloc-item { box-shadow: 0 -1px 0 var(--line); border-radius: 0; }
.alloc-item:hover, .alloc-item[aria-pressed="true"] { background: var(--panel-2); border-radius: 12px; box-shadow: none; }
.alloc-item:hover + .alloc-item, .alloc-item[aria-pressed="true"] + .alloc-item { box-shadow: none; }
.alloc-item .sw { width: 10px; height: 10px; border-radius: 50%; grid-row: 1 / span 2; }
.alloc-item .n { font-weight: 580; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.01em; }
.alloc-item .p { font-weight: 620; font-variant-numeric: tabular-nums; text-align: right; }
.alloc-item .s { grid-column: 2; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alloc-item .e { grid-column: 3; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
@container (max-width: 560px) {
  .alloc { grid-template-columns: minmax(0, 1fr); }
  .alloc-donut { max-width: 230px; }
}

/* Balken */
.hbar { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 13.5px; }
.hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.hbar .track { height: 10px; position: relative; background: var(--panel-2); border-radius: 999px; }
.hbar .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--ink-2); min-width: 4px; }
.hbar .val { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
@media (max-width: 480px) { .hbar { grid-template-columns: minmax(70px, 110px) minmax(0, 1fr) auto; } }

/* Umrechner */
.conv { display: flex; flex-direction: column; gap: 10px; }
.conv-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.conv-out { display: flex; flex-direction: column; }
.conv-out .kv .v { font-size: 15px; }
.conv-out .kv .k { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }

/* ---------- Dialoge & Meldungen ---------- */
.modal-root { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: var(--scrim); animation: fade .16s ease-out; }
.modal {
  width: min(560px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--card-edge); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden;
}
.modal.wide { width: min(680px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 16px 8px 22px; }
.modal-h h2 { font-weight: 660; font-size: 19px; letter-spacing: -0.025em; }
.modal-b { padding: 8px 22px 22px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.modal-b > * { flex-shrink: 0; }
.modal-f { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 12px 22px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--panel); }
.modal-f .spacer { margin-right: auto; }
.preview { font-size: 13px; color: var(--ink-2); padding: 10px 12px; background: var(--panel-2); border-radius: 12px; font-variant-numeric: tabular-nums; }
.preview b { color: var(--ink); }
.sec-title { font-size: 12.5px; font-weight: 620; color: var(--ink-3); margin-top: 6px; letter-spacing: -0.005em; }
.checklist { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; max-height: 200px; overflow-y: auto; }
@media (max-width: 600px) {
  .modal-root { place-items: end stretch; padding: 0; }
  .modal, .modal.wide { width: 100%; max-height: calc(100dvh - 24px - env(safe-area-inset-top, 0px)); border-radius: 24px 24px 0 0; border-bottom: 0; animation: up .24s cubic-bezier(.2, .8, .2, 1); }
  .modal-h { padding-top: 22px; position: relative; }
  .modal-h::before { content: ""; position: absolute; top: 8px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--line-strong); }
  .modal-f .btn { flex: 1 1 auto; height: 46px; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: .5; } }

.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 70; display: flex; flex-direction: column; gap: 8px; width: max-content; max-width: calc(100% - 32px); }

async function runPool(items, fn, n, onProgress) {
  let i = 0, done = 0;
  const worker = async () => {
    while (i < items.length) {
      const it = items[i++];
      await fn(it);
      done++;
      if (onProgress) onProgress(done, items.length);

  };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
}

  const doc = ratesDoc() || {};

  for (const c of ["BTC", "USDT"]) {
    const live = S.live.rates && S.live.rates[c];
    const stored = doc[c] && doc[c].eur > 0 ? doc[c] : null;
    const man = manual[c] > 0 ? { eur: manual[c], at: manual.at || 0, src: "manual" } : null;
    if (rateMode() === "manual") out[c] = man || (stored && Object.assign({}, stored)) || null;
    else if (live && live.eur > 0) out[c] = Object.assign({}, live, { at: S.live.at, src: "live" });

let memo = { v: -1, r: -1, d: null };

function txEffects(t) {
  // Liefert [[accountId, minorDelta], …]

  if (a) {
    const m = toMinor(t.amount, a.currency);
    if (t.kind === "expense" || t.kind === "transfer") out.push([a.id, -Math.abs(m)]);
    else if (t.kind === "income") out.push([a.id, Math.abs(m)]);
    else if (t.kind === "adjust") out.push([a.id, m]);
  }
  if (t.kind === "transfer") {
    const b = S.data.accounts.get(t.toAccountId);
    if (b) out.push([b.id, Math.abs(toMinor(t.toAmount, b.currency))]);
  }

}
function derive() {
  if (memo.v === DATA_V && memo.r === RATES_V && memo.d) return memo.d;
  const minor = new Map();
  for (const a of S.data.accounts.values()) minor.set(a.id, toMinor(a.opening || 0, a.currency));
  const txCount = new Map();
  for (const t of S.data.tx.values()) {
    for (const [id, d] of txEffects(t)) {
      minor.set(id, (minor.get(id) || 0) + d);
      txCount.set(id, (txCount.get(id) || 0) + 1);

  for (const [id, m] of minor) bal.set(id, fromMinor(m, S.data.accounts.get(id).currency));

    else { g.eur = e; total += e; }

/* ---------- Fixkosten-Termine ---------- */
function occurrences(f, from, to) {
  const out = [];

  if (f.interval === "weekly") {
    let d = f.anchor;
    if (d < from) d = addDays(d, Math.ceil(daysBetween(d, from) / 7) * 7);
    for (let g = 0; g < 600 && d <= to; g++, d = addDays(d, 7)) out.push(d);
    return out;
  }
  const step = (INTERVALS[f.interval] || INTERVALS.monthly).step;
  const a = parseISO(f.anchor), fr = parseISO(from);
  let k = Math.max(0, Math.floor(((fr.getFullYear() - a.getFullYear()) * 12 + fr.getMonth() - a.getMonth()) / step) - 1);
  for (let g = 0; g < 600; g++, k++) {
    const d = addMonthsClamped(f.anchor, k * step);
    if (d > to) break;
    if (d >= from) out.push(d);
  }
  return out;
}
function intervalDays(f) {
  return f.interval === "weekly" ? 7 : (INTERVALS[f.interval] || INTERVALS.monthly).step * 31;
}

  if (!validISO(f.anchor) || f.anchor > today) return null;
  const occ = occurrences(f, addDays(today, -intervalDays(f) - 1), today);
  return occ.length ? occ[occ.length - 1] : null;
}

  if (!validISO(f.anchor)) return null;
  const start = f.anchor > today ? f.anchor : addDays(today, 1);

function monthlyEquivEUR(f) {
  const v = toEUR(monthlyEquiv(f), f.currency || "EUR");
  return v == null ? 0 : v;
}
function fixedStatus(f, today) {
  const p = prevDue(f, today), n = nextDue(f, today);
  const pTx = p ? S.data.tx.get(fixedTxId(f.id, p)) : null;
  const nTx = n ? S.data.tx.get(fixedTxId(f.id, n)) : null;
  if (p && !pTx) return { state: "open", due: p, next: n };
  if (n && !nTx && daysBetween(today, n) <= 7) return { state: "soon", due: n, next: n, paidPrev: !!pTx };
  if (n && nTx) return { state: "paid", due: n, next: n, early: true };

  }
  return out.sort((a, b) => a.due.localeCompare(b.due));
}

/* ---------- Ziele ---------- */
function goalProgress(g) {
  let cur = 0, ok = true;
  if (g.kind === "networth") {
    const d = derive();
    const v = convert(d.total, "EUR", g.currency);
    if (v == null || d.missing.length) ok = false;
    cur = v == null ? 0 : v;
  } else {
    for (const id of g.accountIds || []) {
      const a = S.data.accounts.get(id);
      if (!a) continue;
      const v = convert(balanceOf(id), a.currency, g.currency);
      if (v == null) ok = false; else cur += v;
    }
    cur += +g.manual || 0;
  }
  const pct = g.target > 0 ? cur / g.target : 0;
  let perMonth = null, monthsLeft = null;
  if (validISO(g.deadline)) {
    monthsLeft = Math.max(0, daysBetween(isoDate(), g.deadline) / 30.44);
    const rest = Math.max(0, g.target - cur);
    perMonth = monthsLeft > 0.5 ? rest / monthsLeft : rest;
  }
  return { current: cur, pct, ok, perMonth, monthsLeft };
}

   (accounts, tx, fixed, budgets, goals, snaps, meta). Jedes Dokument hat ein
   Feld „id“. Alles bleibt auf diesem Gerät – es gibt keinen Server.

   Neue Sammlung oder Index? → IDB_VERSION erhöhen und in onupgradeneeded
   ergänzen. Bestehende Daten nie löschen, nur ergänzen (siehe CLAUDE.md).
   ====================================================================== */
const IDB_NAME = "kassensturz";
const IDB_VERSION = 1;
let IDB = null;
const CHANNEL = typeof BroadcastChannel === "function" ? new BroadcastChannel("kassensturz") : null;

function idbOpen() {
  return new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(IDB_NAME, IDB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const c of COLS) if (!db.objectStoreNames.contains(c)) db.createObjectStore(c, { keyPath: "id" });
    };
    req.onsuccess = () => {
      const db = req.result;
      // Eine neuere Version der App will die Datenbank umbauen: Platz machen und neu laden.
      db.onversionchange = () => { db.close(); location.reload(); };
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error("IndexedDB nicht verfügbar"));
    req.onblocked = () => console.warn("IndexedDB: wartet auf andere geöffnete Fenster");
  });
}

function idbRun(stores, mode, fn) {
  return new Promise((resolve, reject) => {
    let t;
    try { t = IDB.transaction(stores, mode); } catch (e) { reject(e); return; }
    let out;
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || Object.assign(new Error("abgebrochen"), { code: "aborted" }));
    try { out = fn(t); } catch (e) { try { t.abort(); } catch (x) { /* schon beendet */ } reject(e); }
  });
}

/** Lädt Sammlungen aus dem Speicher in S.data. */
async function loadCollections(cols) {
  const res = {};
  await idbRun(cols, "readonly", (t) => {
    for (const c of cols) {
      const r = t.objectStore(c).getAll();
      r.onsuccess = () => { res[c] = r.result || []; };
    }
  });
  for (const c of cols) {
    const m = new Map();
    for (const d of res[c] || []) if (d && d.id != null) m.set(String(d.id), d);
    S.data[c] = m;
    S.loaded[c] = true;
  }
}

function plain(o) { return o == null ? {} : JSON.parse(JSON.stringify(o)); }

/**
 * Schreibt mehrere Änderungen in einem Rutsch (alles oder nichts).
 * ops: [[sammlung, id, "set" | "update" | "delete", daten], …]
 */
async function dbBatch(ops) {
  if (!IDB) throw Object.assign(new Error("Speicher nicht bereit"), { code: "not_ready" });
  if (!ops.length) return;
  const cols = Array.from(new Set(ops.map((o) => o[0])));
  const applied = [];
  await idbRun(cols, "readwrite", (t) => {
    for (const [c, id, op, data] of ops) {
      const st = t.objectStore(c);
      const key = String(id);
      if (op === "delete") { st.delete(key); applied.push([c, key, null]); continue; }
      const base = op === "update" ? plain(S.data[c].get(key)) : {};
      const doc = Object.assign(base, plain(data), { id: key });
      st.put(doc);
      applied.push([c, key, doc]);
    }
  });
  // Erst nach dem erfolgreichen Speichern den Arbeitsstand nachziehen
  const touched = new Set();
  for (const [c, id, doc] of applied) {
    if (doc) S.data[c].set(id, doc); else S.data[c].delete(id);
    touched.add(c);
  }
  for (const c of touched) onDataChanged(c);
  if (CHANNEL) { try { CHANNEL.postMessage({ type: "changed", cols: Array.from(touched) }); } catch (e) { /* egal */ } }
  if (S.persisted == null) requestPersistence();
}

function dbWrite(colName, id, op, data) {
  return dbBatch([[colName, id, op, data]]);
}

/** Bittet den Browser, die Daten nicht automatisch zu löschen. */
async function requestPersistence() {
  try {
    if (!navigator.storage || !navigator.storage.persist) { S.persisted = false; return; }
    S.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
  } catch (e) { S.persisted = false; }
}

/** Änderungen aus anderen Fenstern (z. B. zweiter Browser-Tab) übernehmen. */
if (CHANNEL) {
  CHANNEL.onmessage = async (e) => {
    const m = e.data || {};
    if (m.type !== "changed" || !IDB || !Array.isArray(m.cols)) return;
    const cols = m.cols.filter((c) => COLS.includes(c));
    if (!cols.length) return;
    try { await loadCollections(cols); for (const c of cols) onDataChanged(c); } catch (err) { console.warn(err); }
  };
}

/* ===== rates.js ===== */
/* ======================================================================
   Live-Kurse direkt von öffentlichen Börsen-Schnittstellen (ohne Konto,
   ohne Schlüssel). Reihenfolge: Crypto.com → Binance → CoinGecko → Coinbase.
   Liefert eine Quelle nicht, springt die nächste ein. Ergebnis:
   { BTC: { eur, ch24, usd }, USDT: { eur, ch24 } }  (ch24 in Prozent)
   ====================================================================== */
const RATE_POLL_MS = 60 * 1000;
const RATE_TIMEOUT_MS = 7000;
const LIVE = { timer: null, inflight: null, lastPersist: 0, failedAt: {} };

function pctFromChange(last, ch) {
  // Crypto.com liefert die 24h-Änderung als Anteil (0,0123 = 1,23 %), manchmal absolut
  if (ch == null || !isFinite(ch)) return null;
  if (Math.abs(ch) < 0.5) return ch * 100;
  const prev = last - ch;
  return prev > 0 ? (ch / prev) * 100 : null;
}
function invPct(p) { return p == null || !isFinite(p) ? null : (1 / (1 + p / 100) - 1) * 100; }
function num(v) { const n = typeof v === "number" ? v : parseFloat(String(v == null ? "" : v)); return isFinite(n) ? n : NaN; }
function sane(r) {
  const out = {};
  if (r.BTC && r.BTC.eur > 1000 && r.BTC.eur < 1e7) out.BTC = r.BTC;
  if (r.USDT && r.USDT.eur > 0.5 && r.USDT.eur < 2) out.USDT = r.USDT;
  return out;
}
async function getJSON(url) {
  const ctl = typeof AbortController === "function" ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), RATE_TIMEOUT_MS);
  try {
    const r = await fetch(url, { signal: ctl ? ctl.signal : undefined, cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer" });
    if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), { code: "http_" + r.status });
    return await r.json();
  } finally { clearTimeout(timer); }
}

const RATE_SOURCES = [
  {
    id: "cryptocom", name: "Crypto.com",
    async get() {
      const one = async (inst) => {
        const j = await getJSON("https://api.crypto.com/exchange/v1/public/get-tickers?instrument_name=" + inst);
        const t = j && j.result && Array.isArray(j.result.data) ? j.result.data.find((x) => x && x.i === inst) : null;
        if (!t) throw new Error("kein Kurs für " + inst);
        const last = num(t.a);
        return { last, ch: pctFromChange(last, num(t.c)) };
      };
      const [b, u] = await Promise.allSettled([one("BTC_EUR"), one("EUR_USDT")]);
      const out = {};
      if (b.status === "fulfilled" && b.value.last > 0) out.BTC = { eur: b.value.last, ch24: b.value.ch, usd: null };
      if (u.status === "fulfilled" && u.value.last > 0) out.USDT = { eur: 1 / u.value.last, ch24: invPct(u.value.ch) };
      return out;
    },
  },
  {
    id: "binance", name: "Binance",
    async get() {
      const q = "/api/v3/ticker/24hr?symbols=" + encodeURIComponent('["BTCEUR","EURUSDT"]');
      let j;
      try { j = await getJSON("https://api.binance.com" + q); } catch (e) { j = await getJSON("https://data-api.binance.vision" + q); }
      const by = {};
      for (const t of Array.isArray(j) ? j : []) by[t.symbol] = t;
      const out = {};
      if (by.BTCEUR) out.BTC = { eur: num(by.BTCEUR.lastPrice), ch24: num(by.BTCEUR.priceChangePercent), usd: null };
      if (by.EURUSDT && num(by.EURUSDT.lastPrice) > 0) out.USDT = { eur: 1 / num(by.EURUSDT.lastPrice), ch24: invPct(num(by.EURUSDT.priceChangePercent)) };
      return out;
    },
  },
  {
    id: "coingecko", name: "CoinGecko",
    async get() {
      const j = await getJSON("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,tether&vs_currencies=eur,usd&include_24hr_change=true");
      const out = {};
      if (j && j.bitcoin) out.BTC = { eur: num(j.bitcoin.eur), ch24: isFinite(num(j.bitcoin.eur_24h_change)) ? num(j.bitcoin.eur_24h_change) : null, usd: isFinite(num(j.bitcoin.usd)) ? num(j.bitcoin.usd) : null };
      if (j && j.tether) out.USDT = { eur: num(j.tether.eur), ch24: isFinite(num(j.tether.eur_24h_change)) ? num(j.tether.eur_24h_change) : null };
      return out;
    },
  },
  {
    id: "coinbase", name: "Coinbase",
    async get() {
      const j = await getJSON("https://api.coinbase.com/v2/exchange-rates?currency=EUR");
      const r = (j && j.data && j.data.rates) || {};
      const out = {};
      if (num(r.BTC) > 0) out.BTC = { eur: 1 / num(r.BTC), ch24: null, usd: null };
      if (num(r.USDT) > 0) out.USDT = { eur: 1 / num(r.USDT), ch24: null };
      return out;
    },
  },
];

/** Holt BTC- und USDT-Kurse; probiert Quellen nacheinander, bis beide da sind. */
async function fetchRatesFromSources() {
  const got = {};
  const used = [];
  const errors = [];
  const now = Date.now();
  // Quellen, die gerade erst ausgefallen sind, kommen ans Ende
  const order = RATE_SOURCES.slice().sort((a, b) => ((now - (LIVE.failedAt[a.id] || 0) < 15 * 60000) ? 1 : 0) - ((now - (LIVE.failedAt[b.id] || 0) < 15 * 60000) ? 1 : 0));
  for (const src of order) {
    if (got.BTC && got.USDT) break;
    try {
      const r = sane(await src.get());
      let took = false;
      for (const c of ["BTC", "USDT"]) if (!got[c] && r[c]) { got[c] = r[c]; took = true; }
      if (took) { used.push(src.name); delete LIVE.failedAt[src.id]; }
      if (!r.BTC && !r.USDT) LIVE.failedAt[src.id] = now;
    } catch (e) {
      LIVE.failedAt[src.id] = now;
      errors.push(src.name + ": " + ((e && e.message) || e));
    }
  }
  return { rates: got, src: used.join(" + "), errors };
}

function refreshRates(opts = {}) {
  if (rateMode() === "manual") { S.live.state = "off"; if (opts.manual) openSettings(); return Promise.resolve(); }
  if (LIVE.inflight) return LIVE.inflight;
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    S.live.state = "offline";
    S.live.busy = false;
    scheduleRender();
    if (opts.manual) toast("Kein Internet – es gelten die zuletzt gespeicherten Kurse.", { err: true });
    return Promise.resolve();
  }
  S.live.busy = true;
  if (!S.live.rates) S.live.state = "loading";
  scheduleRender();
  LIVE.inflight = (async () => {
    try {
      const { rates, src, errors } = await fetchRatesFromSources();
      if (rates.BTC || rates.USDT) {
        applyLive(rates, Date.now(), src);
        if (opts.manual) toast("Kurse aktualisiert · " + src);
      } else {
        S.live.state = navigator.onLine === false ? "offline" : "error";
        S.live.msg = errors.slice(0, 2).join(" · ");
        if (opts.manual) toast("Gerade keine Kurse erreichbar – es gelten die zuletzt gespeicherten.", { err: true });
      }
    } finally {
      S.live.busy = false;
      LIVE.inflight = null;
      scheduleRender();
    }
  })();
  return LIVE.inflight;
}

function applyLive(rates, at, src) {
  S.live.rates = Object.assign({}, S.live.rates || {}, rates);
  S.live.at = at;
  S.live.state = "ok";
  S.live.msg = "";
  S.live.src = src || S.live.src;
  RATES_V++;
  persistLive();
  scheduleSnapshot();
  scheduleChecks();
}

async function persistLive() {
  if (S.runtime !== "ok" || !S.live.rates) return;
  const doc = ratesDoc() || {};
  const lastAt = Math.max((doc.BTC && doc.BTC.at) || 0, (doc.USDT && doc.USDT.at) || 0);
  const age = Date.now() - Math.max(lastAt, LIVE.lastPersist);
  const newlyLive = ["BTC", "USDT"].some((c) => S.live.rates[c] && (!doc[c] || doc[c].src !== "live"));
  if (!newlyLive && age >= 0 && age < 10 * 60 * 1000 && doc.BTC && doc.BTC.eur) return;
  LIVE.lastPersist = Date.now();
  const next = Object.assign(stripId(doc), { mode: doc.mode || "live" });
  for (const c of ["BTC", "USDT"]) {
    const l = S.live.rates[c];
    if (l) next[c] = { eur: l.eur, ch24: l.ch24 == null ? null : round(l.ch24, 3), usd: l.usd == null ? null : l.usd, at: S.live.at, src: "live", from: S.live.src || "" };
  }
  try { await dbWrite("meta", "rates", "set", next); } catch (e) { /* nicht kritisch */ }
}

function startRates() {
  if (LIVE.timer) clearInterval(LIVE.timer);
  LIVE.timer = setInterval(() => {
    if (!document.hidden && rateMode() !== "manual") refreshRates();
  }, RATE_POLL_MS);
  if (rateMode() === "manual") S.live.state = "off";
  else refreshRates();
}

/* ===== checks.js ===== */
/* ======================================================================
   Meldungen in der App: Ziel erreicht, Zwischenstände (50/75/90 %),
   Wochenrückblick und Kursrutsch-Warnung. Läuft beim Öffnen, bei neuen
   Kursen und nach Änderungen. Zustand liegt in meta/alerts:
   { v, goals: { id: { level, reachedAt, pct, name } }, log: [...], hist: [...],
     crashAt, weeklyFor, lastRun, lastTotal }
   ====================================================================== */
let checkTimer = null;
let checkRunning = false;
function scheduleChecks(ms) {
  clearTimeout(checkTimer);
  checkTimer = setTimeout(runChecks, ms == null ? 1500 : ms);
}

function lastSunday18(now) {
  const d = new Date(now);
  const back = d.getDay(); // 0 = Sonntag
  const s = new Date(d.getFullYear(), d.getMonth(), d.getDate() - back, 18, 0, 0, 0);
  if (s.getTime() > now) s.setDate(s.getDate() - 7);
  return s;
}

async function runChecks() {
  if (checkRunning || S.runtime !== "ok" || !allLoaded()) return;
  const d = derive();
  if (d.missing.length || !accountsList().length) return;
  const r = effRates();
  if (!r.BTC && d.byCur.BTC.n) return;
  checkRunning = true;
  try {
    const now = Date.now();
    const pr = notifyPrefs();
    const demo = hasDemo();
    const old = alertsDoc();
    const al = old ? JSON.parse(JSON.stringify(stripId(old))) : { v: 1, goals: {}, log: [], hist: [] };
    al.goals = al.goals || {};
    al.log = Array.isArray(al.log) ? al.log : [];
    al.hist = Array.isArray(al.hist) ? al.hist : [];
    const events = [];
    let changed = !old;

    // Ziele
    const seen = new Set();
    for (const g of goalsList()) {
      if (!(g.target > 0)) continue;
      const p = goalProgress(g);
      if (!p.ok) continue;
      seen.add(g.id);
      const level = MILESTONES.filter((m) => p.pct >= m).pop() || 0;
      const st = al.goals[g.id];
      const pct = round(p.pct, 4);
      if (!st) {
        // Zum ersten Mal gesehen: nur merken, nichts melden
        al.goals[g.id] = { level, reachedAt: level >= 1 ? now : null, pct, name: g.name };
        changed = true;
        continue;
      }
      if (level > (st.level || 0)) {
        if (g.notify !== false && !g.demo) {
          if (level >= 1 && pr.goals) events.push({ type: "goal", text: "🎉 Ziel erreicht: " + g.name + " – " + fmtAmt(p.current, g.currency, { max: 5 }) + " von " + fmtAmt(g.target, g.currency, { max: 5 }) });
          else if (level < 1 && pr.milestones) events.push({ type: "milestone", text: g.name + ": " + Math.round(level * 100) + " % geschafft (" + fmtAmt(p.current, g.currency, { max: 5 }) + " von " + fmtAmt(g.target, g.currency, { max: 5 }) + ")" });
        }
        st.level = level;
        if (level >= 1 && !st.reachedAt) st.reachedAt = now;
        changed = true;
      } else if (level < (st.level || 0) && (st.level || 0) < 1 && p.pct < st.level - 0.05) {
        // Zwischenstand deutlich unterschritten: Stufe zurücksetzen, damit die nächste Überschreitung wieder meldet.
        // Erreichte Ziele bleiben erreicht.
        st.level = level;
        changed = true;
      }
      if (Math.abs((st.pct || 0) - pct) >= 0.005 || st.name !== g.name) { st.pct = pct; st.name = g.name; changed = true; }
    }
    for (const id of Object.keys(al.goals)) if (!seen.has(id) && !S.data.goals.has(id)) { delete al.goals[id]; changed = true; }

    const total = d.total;
    const hist = al.hist.filter((h) => now - (h.at || 0) <= 10 * 86400000);
    // Kursrutsch: gleiche Bestände, Kurse von vor ~24 h gegen jetzt
    if (pr.crash && !demo && r.BTC && r.USDT) {
      const ref = hist.filter((h) => now - h.at >= 20 * 3600000 && now - h.at <= 48 * 3600000 && h.btc && h.usdt).sort((a, b) => b.at - a.at)[0];
      if (ref) {
        let then = 0, nowV = 0;
        for (const a of accountsList()) {
          if (a.includeInTotal === false) continue;
          const b = balanceOf(a.id);
          const R0 = { EUR: 1, USDT: ref.usdt, BTC: ref.btc };
          then += b * R0[a.currency];
          nowV += b * rate(a.currency);
        }
        const chg = then > 0 ? (nowV / then - 1) * 100 : 0;
        if (chg <= -pr.crashPct && now - (al.crashAt || 0) > 24 * 3600000) {
          events.push({ type: "crash", text: "⚠️ Kursrutsch: Dein Vermögen ist seit gestern um " + fmtPct(-chg, { dec: 1 }) + " gefallen – jetzt " + fmtEUR(nowV, { dec: 0 }) + " (vorher " + fmtEUR(then, { dec: 0 }) + ")." });
          al.crashAt = now;
          changed = true;
        }
      }
    }
    // Wochenrückblick: ab Sonntag 18 Uhr beim ersten Öffnen, bis Donnerstag
    const sun = lastSunday18(now);
    const wk = isoDate(sun);
    if (!old) al.weeklyFor = wk;
    if (pr.weekly && !demo && al.weeklyFor !== wk && now - sun.getTime() < 4 * 86400000) {
      const weekAgo = hist.filter((h) => now - h.at >= 5 * 86400000).sort((a, b) => Math.abs(now - a.at - 7 * 86400000) - Math.abs(now - b.at - 7 * 86400000))[0]
        || (() => { const s = snapAround(addDays(isoDate(), -7)); return s && s.date <= addDays(isoDate(), -5) ? { total: s.total } : null; })();
      let part = "";
      if (weekAgo && weekAgo.total) {
        const diff = total - weekAgo.total;
        part = " (" + fmtEUR(diff, { sign: true, dec: 0 }) + ", " + fmtPct((diff / Math.abs(weekAgo.total)) * 100, { sign: true }) + " zur Vorwoche)";
      }
      const gl = goalsList().filter((g) => !g.demo).slice(0, 3).map((g) => g.name + " " + Math.round(Math.min(goalProgress(g).pct, 9.99) * 100) + " %");
      events.push({ type: "weekly", text: "Wochenrückblick: Vermögen " + fmtEUR(total, { dec: 0 }) + part + "." + (gl.length ? " Ziele: " + gl.join(", ") + "." : "") });
      al.weeklyFor = wk;
      changed = true;
    } else if (al.weeklyFor !== wk && now - sun.getTime() >= 4 * 86400000) {
      al.weeklyFor = wk; changed = true;
    }
    // Verlauf für den Kursrutsch-Vergleich: höchstens ein Eintrag pro Stunde
    const lastH = hist[hist.length - 1];
    if (!lastH || now - lastH.at >= 3600000) {
      hist.push({ at: now, total: round(total, 2), btc: r.BTC ? r.BTC.eur : null, usdt: r.USDT ? r.USDT.eur : null });
      changed = true;
    }
    al.hist = hist.slice(-80);
    if (events.length) {
      al.log = al.log.concat(events.map((e) => ({ at: now, type: e.type, text: e.text }))).slice(-30);
    }
    if (!changed && old && now - (old.lastRun || 0) < 15 * 60000) return;
    al.lastRun = now;
    al.lastTotal = round(total, 2);
    al.v = 1;
    await dbWrite("meta", "alerts", "set", al);
    events.forEach((e, i) => setTimeout(() => toast(e.text, { ms: e.type === "goal" ? 8000 : 6500, action: e.type === "goal" || e.type === "milestone" ? "Ziele" : null, onAction: () => { location.hash = "#ziele"; } }), 400 + i * 900));
  } catch (e) {
    console.warn("Meldungen:", e);
  } finally {
    checkRunning = false;
  }
}

/* ===== scanparse.js ===== */
/* ======================================================================
   Auswertung erkannter Texte (OCR) – ohne Abhängigkeiten, auch in Node testbar.
   Eingabe: Zeilen von Tesseract { text, bbox:{x0,y0,x1,y1}, words:[{text,bbox}] }
   - parseScreenshot: Banking-App-Screenshots (Umsatzliste, Startseite, Mitteilungen)
   - parseReceipt:    Kassenzettel (Geschäft, Datum, Summe)
   ====================================================================== */
const SCANPARSE = (() => {
  const MONTH = { jan: 1, januar: 1, january: 1, feb: 2, februar: 2, february: 2, mär: 3, mar: 3, märz: 3, maerz: 3, march: 3, apr: 4, april: 4, mai: 5, may: 5, jun: 6, juni: 6, june: 6, jul: 7, juli: 7, july: 7, aug: 8, august: 8, sep: 9, sept: 9, september: 9, okt: 10, oct: 10, oktober: 10, october: 10, nov: 11, november: 11, dez: 12, dec: 12, dezember: 12, december: 12 };
  const WDAY = { so: 0, sun: 0, sonntag: 0, sunday: 0, mo: 1, mon: 1, montag: 1, monday: 1, di: 2, tue: 2, dienstag: 2, tuesday: 2, mi: 3, wed: 3, mittwoch: 3, wednesday: 3, do: 4, thu: 4, donnerstag: 4, thursday: 4, fr: 5, fri: 5, freitag: 5, friday: 5, sa: 6, sat: 6, samstag: 6, saturday: 6 };
  const DECLINED = /unzureichend|abgelehnt|fehlgeschlagen|storniert|rückgängig|zurückgebucht|declined|insufficient|failed|reverted|cancell?ed|reversed/i;
  const SCHEDULED = /anstehend|geplant|fällig|scheduled|upcoming|due (today|tomorrow)/i;
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const dayOnly = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

  function resolveDate(today, day, month, year) {
    if (!(day >= 1 && day <= 31 && month >= 1 && month <= 12)) return null;
    let y = year ? (year < 100 ? 2000 + year : year) : today.getFullYear();
    let d = new Date(y, month - 1, day);
    if (d.getMonth() !== month - 1) return null;
    if (!year && d > today) d = new Date(y - 1, month - 1, day);
    return d;
  }
  /** Sucht Datum und Uhrzeit in einem Text. */
  function findDate(s, today) {
    const t = String(s);
    let date = null, m;
    if (/\b(heute|today|jetzt|now)\b/i.test(t)) date = today;
    else if (/\b(vorgestern)\b/i.test(t)) date = addD(today, -2);
    else if (/\b(gestern|yesterday)\b/i.test(t)) date = addD(today, -1);
    if (!date && (m = t.match(/\b(\d{4})-(\d{2})-(\d{2})\b/))) date = resolveDate(today, +m[3], +m[2], +m[1]);
    if (!date && (m = t.match(/\b(\d{1,2})[./](\d{1,2})[./](\d{2,4})\b/))) date = resolveDate(today, +m[1], +m[2], +m[3]);
    if (!date && (m = t.match(/\b(\d{1,2})\.?\s+([A-Za-zÄÖÜäöü]{3,10})\.?(?:,?\s+(\d{4}))?/))) {
      const mo = MONTH[m[2].toLowerCase()];
      if (mo) date = resolveDate(today, +m[1], mo, m[3] ? +m[3] : 0);
    }
    if (!date && (m = t.match(/\b([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?\b/))) {
      const mo = MONTH[m[1].toLowerCase()];
      if (mo) date = resolveDate(today, +m[2], mo, m[3] ? +m[3] : 0);
    }
    const tm = t.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
    if (!date && tm && (m = t.match(/\b(mo|di|mi|do|fr|sa|so|mon|tue|wed|thu|fri|sat|sun|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b\.?/i))) {
      const wd = WDAY[m[1].toLowerCase()];
      let d = today;
      for (let i = 0; i < 7 && d.getDay() !== wd; i++) d = addD(d, -1);
      date = d;
    }
    return { date: date ? iso(date) : null, time: tm ? pad(+tm[1]) + ":" + tm[2] : null };
  }

  /** Beträge mit Währungszeichen: -106,18 € · +99 € · €19.99 · 1.234,56 EUR */
  const MONEY_RE = /([+\-−–]\s?)?(€\s?)?(\d{1,3}(?:[.,]\d{3})+|\d+)([.,]\d{1,2})?(\s?(?:€|EUR|USDT|BTC))?/g;
  function findMoney(s) {
    // „1.204 56 €“ (Komma nicht erkannt) → 1.204,56 €
    s = String(s).replace(/(\d)\s(\d{2})\s?(€|EUR)/g, (m, a, b, c, i, all) => (/[.,]\d{1,2}$/.test(all.slice(Math.max(0, i - 4), i + 1)) ? m : a + "," + b + " " + c));
    const out = [];
    let m;
    MONEY_RE.lastIndex = 0;
    while ((m = MONEY_RE.exec(s))) {
      if (!m[2] && !m[5]) continue; // ohne Währung ist es keine Geldangabe (Uhrzeit, Anzahl …)
      const before = s[m.index - 1];
      if (before && /[\d:]/.test(before)) continue;
      const intPart = m[3].replace(/[.,]/g, "");
      const value = parseFloat(intPart + (m[4] ? "." + m[4].slice(1) : ""));
      if (!isFinite(value)) continue;
      const sign = m[1] ? (m[1].trim() === "+" ? "+" : "-") : "";
      const cur = /USDT/.test(m[5] || "") ? "USDT" : /BTC/.test(m[5] || "") ? "BTC" : "EUR";
      out.push({ value, sign, cur, index: m.index, end: m.index + m[0].length, text: m[0].trim() });
    }
    return out;
  }
  function parseAmountText(s) {
    const f = findMoney(String(s).includes("€") || /EUR|USDT|BTC/.test(s) ? s : s + " €");
    return f.length ? f[0] : null;
  }

  function median(a) { if (!a.length) return 0; const b = a.slice().sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; }
  function prepLines(raw, W) {
    const lines = [];
    for (const l of raw) {
      let words = (l.words || []).map((w) => ({ t: String(w.text != null ? w.text : w.t || "").trim(), b: w.bbox || w.b })).filter((w) => w.t);
      if (!words.length) continue;
      // Symbole/Logos links (Avatare, App-Icons) wegwerfen
      while (words.length > 1) {
        const w = words[0];
        const inIcon = w.b.x1 < 0.205 * W && w.b.x0 > 0.07 * W;
        const junk = !/[A-Za-zÄÖÜäöü0-9]{2,}/.test(w.t) || /^[^\w€+\-−]+$/.test(w.t);
        if (inIcon || (junk && w.b.x1 < 0.22 * W)) words.shift(); else break;
      }
      const text = words.map((w) => w.t).join(" ").replace(/\s+/g, " ").trim();
      if (!text) continue;
      const b = l.bbox || l.b;
      lines.push({ text, words, x0: words[0].b.x0, x1: words[words.length - 1].b.x1, y0: b.y0, y1: b.y1, h: b.y1 - b.y0 });
    }
    lines.sort((a, b) => a.y0 - b.y0 || a.x0 - b.x0);
    return lines;
  }
  function detectBank(text) {
    const t = text.toLowerCase();
    if (/revolut/.test(t)) return "Revolut";
    if (/bank of cyprus|bankofcyprus|1bank/.test(t)) return "Bank of Cyprus";
    if (/binance/.test(t)) return "Binance";
    if (/\bn26\b/.test(t)) return "N26";
    if (/\bwise\b/.test(t)) return "Wise";
    if (/paypal/.test(t)) return "PayPal";
    if (/trade republic/.test(t)) return "Trade Republic";
    if (/hellenic bank/.test(t)) return "Hellenic Bank";
    if (/unzureichendes guthaben|anstehende zahlung|einzahlen bewegen|kontostand: |zahlungserinnerung/.test(t)) return "Revolut";
    return null;
  }
  function cleanMerchant(s) {
    let m = String(s).replace(/[|\\_“”"»«]/g, " ").replace(/\s+/g, " ").trim();
    m = m.replace(/^[^A-Za-zÄÖÜäöü0-9]+/, "").replace(/[^A-Za-zÄÖÜäöü0-9).&'!]+$/, "");
    m = m.replace(/\s+[A-Za-z|]$/, "").replace(/\s+[^\sA-Za-zÄÖÜäöü0-9]+$/, ""); // einzelne Störzeichen am Ende
    // GROSSBUCHSTABEN → Normal
    if (m.length > 3 && m === m.toUpperCase() && /[A-Z]{3}/.test(m)) m = m.toLowerCase().replace(/(^|[\s\-&./])([a-zäöü])/g, (x, a, b) => a + b.toUpperCase());
    return m.slice(0, 60);
  }

  /* ---------- Screenshots aus Banking-Apps ---------- */
  function parseScreenshot(raw, W, H, opt) {
    const today = dayOnly(opt && opt.today ? new Date(opt.today) : new Date());
    const colorOf = (opt && opt.colorOf) || (() => null);
    const lines = prepLines(raw, W);
    const medH = median(lines.map((l) => l.h)) || 40;
    const wordH = (w) => w.b.y1 - w.b.y0;
    const medWordH = median([].concat(...lines.map((l) => l.words.filter((w) => /[A-Za-zÄÖÜäöü]{3,}/.test(w.t)).map(wordH)))) || medH;
    const statusBar = 0.065 * H;
    const all = lines.map((l) => l.text).join("\n");
    const out = { bank: detectBank(all), balances: [], txs: [], scheduled: [], skipped: 0 };
    const used = new Set();

    // 1) Mitteilungen: Kopfzeile mit Zeitstempel rechts, darunter der Text

    if (Math.round(Math.abs(x.amount) * 100) !== cents) continue;
    if (Math.abs(daysBetween(x.date, t.date)) > 1) continue;
    return x;
  }
  return null;
}
function suggestFixed(merged) {
  const out = [];
  const exists = (name) => Array.from(S.data.fixed.values()).some((f) => String(f.name).toLowerCase() === String(name).toLowerCase());
  for (const s of merged.scheduled) {
    if (exists(s.merchant)) continue;
    out.push({ name: s.merchant, amount: s.amount, cur: s.cur || "EUR", anchor: s.date, why: "geplante Zahlung" });
  }
  // Wiederkehrend: gleicher Händler, gleicher Betrag, in mindestens zwei verschiedenen Monaten
  const pool = [];
  for (const t of S.data.tx.values()) if (t.kind === "expense" && t.note) pool.push({ m: String(t.note).toLowerCase(), a: Math.round(Math.abs(t.amount) * 100), d: t.date });
  for (const t of merged.txs) if (t.kind === "expense") pool.push({ m: t.merchant.toLowerCase(), a: Math.round(t.amount * 100), d: t.date, t });
  for (const t of merged.txs) {
    if (t.kind !== "expense" || exists(t.merchant) || out.some((o) => o.name.toLowerCase() === t.merchant.toLowerCase())) continue;
    const same = pool.filter((p) => p.m === t.merchant.toLowerCase() && Math.abs(p.a - Math.round(t.amount * 100)) <= Math.max(50, t.amount * 5));
    const months = new Set(same.map((p) => monthKey(p.d)));
    if (months.size >= 2) {
      const last = same.map((p) => p.d).sort().pop();
      out.push({ name: t.merchant, amount: t.amount, cur: t.cur || "EUR", anchor: addMonthsClamped(last, 1), why: "kommt jeden Monat" });
    }
  }
  return out;
}

/** Baut aus der Prüfliste die Speicher-Schritte (oder nur eine Vorschau für den Kontostand). */
function scanPlan(f, txs, balance, fixedSug, previewOnly) {
  const accVal = val(f, "sc-acc");
  const isNew = accVal.startsWith("new:");
  const bankName = isNew ? accVal.slice(4) : null;
  const accId = isNew ? newId("acc") : accVal;
  const acc = isNew ? null : S.data.accounts.get(accId);
  if (!isNew && !acc) return { error: "Wähl ein Konto." };
  const cur = isNew ? (txs[0] && txs[0].cur) || (balance && balance.cur) || "EUR" : acc.currency;
  const ops = [];
  const newTx = [];
  let bad = false;
  txs.forEach((t, i) => {
    if (!f.querySelector("#sc-ck-" + i).checked) return;
    const amt = parseNum(val(f, "sc-a-" + i), cur);
    if (!isFinite(amt) || amt <= 0) { bad = true; return; }
    const date = validISO(val(f, "sc-d-" + i)) ? val(f, "sc-d-" + i) : t.date;
    const merchant = val(f, "sc-m-" + i) || t.merchant;
    const e = toEUR(amt, cur);
    const doc = { kind: t.kind, date, accountId: accId, amount: round(amt, cur === "BTC" ? 8 : 6), category: val(f, "sc-c-" + i) || "Sonstiges", note: merchant, eur: e == null ? null : round(e, 2), importKey: scanKey(t), source: "scan", createdAt: Date.now() + i };
    if (t.time) doc.time = t.time;
    newTx.push(doc);
    ops.push(["tx", newId("tx"), "set", doc]);
  });
  if (bad && !previewOnly) return { error: "Mindestens ein Betrag ist keine gültige Zahl." };
  // Kontostand zum Zeitpunkt des Screenshots angleichen
  let balanceNote = "";
  const balOn = f.querySelector("#sc-bal") && f.querySelector("#sc-bal").checked;
  let adjust = 0, opening = 0;
  if (balance && balOn) {
    const upTo = (t) => t.date < balance.date || (t.date === balance.date && (!t.time || !balance.time || t.time <= balance.time));
    const eff = (t) => (t.kind === "income" ? 1 : -1) * Math.abs(t.amount);
    let sum = 0;
    for (const t of newTx) if (upTo(t)) sum += eff(t);
    if (isNew) {
      opening = round(balance.value - sum, cur === "BTC" ? 8 : 2);
      balanceNote = "Startsaldo wird passend gesetzt";
    } else {
      // Bisheriger Stand bis zu diesem Zeitpunkt (ohne die neuen Umsätze)
      let have = +acc.opening || 0;
      for (const t of S.data.tx.values()) {
        for (const [id, d] of txEffects(t)) if (id === accId && upTo(t)) have += fromMinor(d, cur);
      }
      adjust = round(balance.value - (have + sum), cur === "BTC" ? 8 : 2);
      balanceNote = Math.abs(adjust) < 0.005 ? "passt schon" : "Korrektur " + fmtAmt(adjust, cur, { sign: true });
    }
  }
  if (previewOnly) return { balanceNote };
  if (isNew) {
    const order = Math.max(0, ...accountsList(true).map((x) => x.order || 0)) + 1;
    ops.unshift(["accounts", accId, "set", { name: bankName, currency: cur, kind: /binance|crypto/i.test(bankName) ? "exchange" : "bank", opening, includeInTotal: true, archived: false, order, note: "", createdAt: Date.now() }]);
  } else if (Math.abs(adjust) >= 0.005) {
    ops.push(["tx", newId("tx"), "set", { kind: "adjust", date: balance.date, time: balance.time || undefined, accountId: accId, amount: adjust, note: "Abgleich mit Screenshot", eur: (() => { const e = toEUR(Math.abs(adjust), cur); return e == null ? null : round(e, 2); })(), source: "scan", createdAt: Date.now() }]);
  }
  let nfx = 0;
  fixedSug.forEach((s, i) => {
    const c = f.querySelector("#sc-fx-" + i);
    if (!c || !c.checked) return;
    nfx++;
    ops.push(["fixed", newId("fx"), "set", { kind: "expense", name: s.name, amount: s.amount, currency: s.cur || cur, interval: "monthly", anchor: s.anchor, accountId: accId, category: learnedCategory(s.name, "expense"), active: true, createdAt: Date.now() }]);
  });
  const app = S.data.meta.get("app") || {};
  if (SCAN_BANK) ops.push(["meta", "app", "update", { scanAccounts: Object.assign({}, app.scanAccounts || {}, { [SCAN_BANK]: accId }) }]);
  const parts = [];
  if (newTx.length) parts.push(newTx.length + (newTx.length === 1 ? " Umsatz" : " Umsätze") + " gebucht");
  if (balance && balOn) parts.push(isNew ? "Konto „" + bankName + "“ angelegt" : Math.abs(adjust) >= 0.005 ? "Kontostand angeglichen" : "Kontostand stimmt");
  if (nfx) parts.push(nfx + " Fixkosten angelegt");
  return { ops, summary: parts.join(" · ") };
}

async function scanReceipt(file) {
  if (!file) return;
  const set = scanProgress("Kassenzettel lesen");
  let r, thumb;
  try {
    OCR.onProgress = ocrProgressHandler(set, 0, 100, "Lese Kassenzettel …");
    set(3, "Lese Kassenzettel …");
    const { img, url } = await loadImageFile(file);
    thumb = thumbOf(img, 640);
    const prep = prepareImage(img, "receipt");
    URL.revokeObjectURL(url);
    const lines = await recognize(prep.canvas);
    r = SCANPARSE.parseReceipt(lines, prep.W, prep.H, { today: isoDate() });
  } catch (e) { scanError(e); return; } finally { OCR.onProgress = null; }
  closeModal(true);
  const app = S.data.meta.get("app") || {};
  const accId = app.lastReceiptAcc && S.data.accounts.get(app.lastReceiptAcc) ? app.lastReceiptAcc : undefined;
  openTxForm({
    prefill: { kind: "expense", amount: r.total != null ? r.total : undefined, note: r.merchant || "", date: r.date || isoDate(), category: r.merchant ? learnedCategory(r.merchant, "expense") : "", accountId: accId },
    receipt: { thumb, found: r },
  });
}

let renderDeferred = false;

/** Baut den Hauptbereich neu auf. passive = von selbst ausgelöst (neue Kurse, Daten), nicht durch einen Tipp. */
function renderMain(passive) {
  const main = $("#main");
  if (S.runtime === "pending") return;
  if (S.runtime !== "ok") {
    main.innerHTML = runtimeMessage();
    lastMainHtml = "";
    return;
  }
  const ae = document.activeElement;
  const typing = !!(ae && main.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
  if (passive && typing) {
    // Während getippt wird nichts austauschen (sonst springt die Tastatur bzw. die Seite) – danach nachholen
    if (!renderDeferred) {
      renderDeferred = true;
      ae.addEventListener("blur", () => { renderDeferred = false; scheduleRender(); }, { once: true });
    }
    return;
  }
  const keep = typing && ae.id ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const scrollY0 = window.scrollY;
  const scrollers = $$("[data-keep-scroll]", main).map((el) => [el.dataset.keepScroll, el.scrollTop, el.scrollLeft]);
  let html;
  if (needsWelcome()) html = welcomeHtml();
  else {
    html = banners();

    html += v();
  }
  if (html === lastMainHtml && main.firstChild) return; // nichts geändert – kein Neuaufbau, kein Flackern
  lastMainHtml = html;
  main.innerHTML = html;
  for (const [k, t, l] of scrollers) {
    const el = main.querySelector('[data-keep-scroll="' + k + '"]');
    if (el) { el.scrollTop = t; el.scrollLeft = l; }
  }
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) {
      el.focus({ preventScroll: true });
      try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) { /* select */ }
    }
  }
  afterRender();
  const routeChanged = renderedRoute !== S.ui.route;
  renderedRoute = S.ui.route;
  if (routeChanged) window.scrollTo(0, 0);
  else keepScroll(scrollY0);
}

function snapAround(targetISO) {
  // letzter Snapshot an oder vor dem Datum, sonst der früheste danach
  let best = null, first = null;
  for (const s of S.data.snaps.values()) {
    if (!s.date || !isFinite(s.total)) continue;
    if (!first || s.date < first.date) first = s;
    if (s.date <= targetISO && (!best || s.date > best.date)) best = s;
  }
  return best || first;
}

function budgetState(spent, limit) {

}
function budgetBlock(b, spent, compact) {

function txRow(t, compact) {

    sub = accName(t.accountId) + " → " + accName(t.toAccountId);
    amt = "<div>" + fmtAmt(-Math.abs(t.amount), cur) + '</div><div class="sub">' + (b ? fmtAmt(Math.abs(t.toAmount), b.currency, { sign: true }) : "") + "</div>";
  } else if (t.kind === "adjust") {
    glyph = '<span class="glyph">' + icon("adjust") + "</span>";
    sub = accName(t.accountId) + (t.note ? " · " + esc(t.note) : "");
    amt = "<div>" + fmtAmt(t.amount, cur, { sign: true }) + "</div>" + (cur !== "EUR" ? '<div class="sub">≈ ' + fmtEUR(Math.abs(txEUR(t)) * Math.sign(t.amount || 0), { sign: true }) + "</div>" : "");

  }

    '<div><div class="t">' + txTitle(t) + demoTag(t) + '</div><div class="sub">' + when + sub + "</div></div>" +
    '<div class="amt">' + amt + "</div></div>";
}
VIEWS.buchungen = function () {

  for (const t of list) {
    const acc = S.data.accounts.get(t.accountId);

    else if (t.kind === "expense") exp += txEUR(t);

  const kindOpts = [["", "Alle Arten"], ["expense", "Ausgaben"], ["income", "Einnahmen"], ["transfer", "Umbuchungen"], ["adjust", "Kontostand-Korrekturen"]].map(([k, l]) => '<option value="' + k + '"' + (f.kind === k ? " selected" : "") + ">" + l + "</option>").join("");

    '<div class="dash">' +

function fixedRowFull(f, today) {

/* ---------- Budget ---------- */
VIEWS.budget = function () {
  if (!S.ui.budgetMonth) S.ui.budgetMonth = monthKey(isoDate());
  const ym = S.ui.budgetMonth;
  const f = monthFlows(ym);
  const budgets = Array.from(S.data.budgets.values()).sort((a, b) => String(a.category).localeCompare(String(b.category), "de"));
  const budgeted = new Set(budgets.map((b) => b.category));
  let limit = 0, spentB = 0, spentOther = 0;

/* ======================================================================
   Diagramme (SVG, ohne Bibliothek): Vermögensverlauf und Aufteilung
   ====================================================================== */
const SVGNS = "http://www.w3.org/2000/svg";
function niceTicks(min, max, n) {
  if (!isFinite(min) || !isFinite(max)) return { lo: 0, hi: 1, ticks: [0, 1] };
  if (min === max) { const pad = Math.abs(max) * 0.05 || 1; min -= pad; max += pad; }
  const step0 = (max - min) / (n || 4);
  const mag = 10 ** Math.floor(Math.log10(step0));
  const norm = step0 / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo, g = 0; v <= hi + step / 2 && g < 20; v += step, g++) ticks.push(Math.round(v * 1e6) / 1e6);
  return { lo, hi, ticks };
}
function chartSeries() {
  const today = isoDate();
  const back = { "1M": 31, "3M": 92, "6M": 183, "1J": 366 }[S.ui.chart.range];
  const from = back ? addDays(today, -back) : "0000-01-01";
  const pts = Array.from(S.data.snaps.values())
    .filter((s) => validISO(s.date) && s.date >= from && s.date <= today && isFinite(s.total))
    .sort((a, b) => a.date.localeCompare(b.date))
    .map((s) => ({ date: s.date, total: s.total, EUR: (s.byCur && s.byCur.EUR) || 0, USDT: (s.byCur && s.byCur.USDT) || 0, BTC: (s.byCur && s.byCur.BTC) || 0 }));
  const d = derive();
  if (accountsList().length && !d.missing.length) {
    const live = { date: today, total: d.total, EUR: d.byCur.EUR.eur || 0, USDT: d.byCur.USDT.eur || 0, BTC: d.byCur.BTC.eur || 0, live: true };
    if (pts.length && pts[pts.length - 1].date === today) pts[pts.length - 1] = live;
    else pts.push(live);
  }
  return pts;
}
function el(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function xTicks(first, last, width) {
  const span = daysBetween(first, last);
  const out = [];
  if (span <= 45) {
    const n = width < 420 ? 3 : 5;
    for (let i = 0; i <= n; i++) {
      const d = addDays(first, Math.round((span * i) / n));
      const dt = parseISO(d);
      out.push({ d, label: dt.getDate() + ". " + MONTHS_AX[dt.getMonth()] });
    }
    return out;
  }
  let m = parseISO(first);
  m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
  const months = [];
  for (let g = 0; g < 400; g++) {
    const d = isoDate(m);
    if (d > last) break;
    months.push(m);
    m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
  }
  const maxTicks = Math.max(2, Math.floor(width / 64));
  const every = Math.max(1, Math.ceil(months.length / maxTicks));
  months.forEach((dt, i) => {
    if (i % every) return;
    const yr = dt.getMonth() === 0 || (i === 0 && span > 330) ? " ’" + String(dt.getFullYear()).slice(2) : "";
    out.push({ d: isoDate(dt), label: MONTHS_AX[dt.getMonth()] + yr });
  });
  return out;
}
let chartUid = 0;
let lastChartH = 0; // reservierte Höhe, damit beim Neuzeichnen nichts zusammenfällt
function drawNetWorthChart() {
  const host = $("#chart-nw");
  if (!host) return;
  const pts = chartSeries();
  const mode = S.ui.chart.mode;
  if (S.ui.chart.table) {
    host.innerHTML = chartTable(pts);
    return;
  }
  if (pts.length < 2) {
    host.innerHTML = '<p class="chart-empty">Der Verlauf füllt sich ab jetzt von selbst: An jedem Tag, an dem du Kassensturz öffnest, wird dein Gesamtvermögen gespeichert.' + (pts.length ? " Heute: <b>" + fmtEUR(pts[0].total) + "</b>." : "") + " Bis dahin zeigt dir <b>Aufteilung</b>, wie sich dein Vermögen verteilt.</p>";
    return;
  }
  const W = Math.max(280, Math.round(host.clientWidth || 600));
  const H = W < 520 ? 196 : 256;
  lastChartH = H;
  const M = { l: 46, r: 10, t: 12, b: 26 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const first = pts[0].date, last = pts[pts.length - 1].date;
  const span = Math.max(1, daysBetween(first, last));
  const X = (d) => M.l + (daysBetween(first, d) / span) * iw;
  let yt;
  if (mode === "cur") {
    const max = Math.max(...pts.map((p) => p.EUR + p.USDT + p.BTC), 1);
    yt = niceTicks(0, max, 4);
  } else {
    const vals = pts.map((p) => p.total);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo) * 0.14 || Math.abs(hi) * 0.03 || 1;
    yt = niceTicks(Math.max(lo >= 0 ? 0 : -Infinity, lo - pad), hi + pad, 4);
  }
  const Y = (v) => M.t + ih - ((v - yt.lo) / (yt.hi - yt.lo || 1)) * ih;
  const uid = "g" + ++chartUid;

  const svg = el("svg", { class: "plot", viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "img", tabindex: "0", "aria-label": "Vermögensverlauf von " + fmtDate(first, true) + " bis " + fmtDate(last, true) + ": " + fmtEUR(pts[0].total) + " auf " + fmtEUR(pts[pts.length - 1].total) + ". Pfeiltasten zeigen einzelne Tage." }, host);
  const defs = el("defs", {}, svg);
  const lg = el("linearGradient", { id: uid, x1: "0", y1: "0", x2: "0", y2: "1" }, defs);
  el("stop", { offset: "0", style: "stop-color:var(--ink);stop-opacity:.16" }, lg);
  el("stop", { offset: "1", style: "stop-color:var(--ink);stop-opacity:0" }, lg);
  // Raster
  const g0 = el("g", {}, svg);
  for (const t of yt.ticks) {
    const y = Math.round(Y(t)) + 0.5;
    el("line", { class: t === yt.lo ? "base" : "gl", x1: M.l, x2: W - M.r, y1: y, y2: y }, g0);
    const tx = el("text", { class: "ax", x: 0, y: y + 3.5, "text-anchor": "start" }, g0);
    tx.textContent = fmtCompactEUR(t);
  }
  for (const tk of xTicks(first, last, iw)) {
    const x = X(tk.d);
    if (x < M.l + 14 || x > W - M.r - 14) continue;
    const tx = el("text", { class: "ax", x, y: H - 6, "text-anchor": "middle" }, g0);

  const lineD = (acc) => pts.map((p, i) => (i ? "L" : "M") + X(p.date).toFixed(1) + " " + Y(acc(p)).toFixed(1)).join("");
  const series = [];
  if (mode === "cur") {

    for (const c of CURS) {

      const upper = cum.slice();
      if (!pts.some((p) => p[c] > 0)) continue;
      const top = pts.map((p, i) => (i ? "L" : "M") + X(p.date).toFixed(1) + " " + Y(upper[i]).toFixed(1)).join("");
      const bottom = pts.slice().reverse().map((p, j) => { const i = pts.length - 1 - j; return "L" + X(p.date).toFixed(1) + " " + Y(lower[i]).toFixed(1); }).join("");
      el("path", { d: top + bottom + "Z", fill: CUR[c].color, "fill-opacity": "0.18", stroke: "none" }, gd);
      el("path", { d: top, fill: "none", stroke: CUR[c].color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, gd);
      series.push({ c, upper });
    }
  } else {
    const area = lineD((p) => p.total) + "L" + X(last).toFixed(1) + " " + (M.t + ih) + "L" + X(first).toFixed(1) + " " + (M.t + ih) + "Z";
    el("path", { d: area, fill: "url(#" + uid + ")", stroke: "none" }, gd);
    el("path", { d: lineD((p) => p.total), fill: "none", stroke: "var(--ink)", "stroke-width": 2.2, "stroke-linejoin": "round", "stroke-linecap": "round" }, gd);

  el("circle", { cx: X(lp.date), cy: ly, r: 4.5, fill: "var(--ink)", stroke: "var(--panel)", "stroke-width": 2 }, gd);
  // Interaktion
  const gh = el("g", { style: "display:none" }, svg);
  const xh = el("line", { class: "xh", y1: M.t, y2: M.t + ih }, gh);
  const dots = [];
  const dotSeries = mode === "cur" ? series.map((s) => ({ color: CUR[s.c].color, get: (i) => s.upper[i] })) : [{ color: "var(--ink)", get: (i) => pts[i].total }];

    tip.innerHTML = '<div class="d">' + (p.live ? "Jetzt · " : "") + WD[parseISO(p.date).getDay()] + ", " + fmtDate(p.date, true) + "</div>" +
      '<div class="tr"><span class="k" style="background:var(--ink)"></span><span class="n">Gesamt</span><span class="v">' + fmtEUR(p.total) + "</span></div>" + rows;

function allocData() {

      const list = accountsList()
        .filter((a) => a.currency === c && a.includeInTotal !== false)
        .map((a) => { const b = balanceOf(a.id); return { key: a.id, name: a.name, cur: c, native: b, eur: toEUR(b, c) }; })
        .filter((x) => x.eur != null && x.eur > 0.005)
        .sort((a, b) => b.eur - a.eur);

    }
    if (items.length > 9) {
      const sorted = items.slice().sort((a, b) => b.eur - a.eur);
      const keep = new Set(sorted.slice(0, 8).map((x) => x.key));
      const rest = items.filter((x) => !keep.has(x.key));
      items = items.filter((x) => keep.has(x.key));
      items.push({ key: "_rest", name: rest.length + " weitere Konten", cur: null, native: null, eur: rest.reduce((s, x) => s + x.eur, 0), color: "var(--ink-3)" });
    }
  } else {
    items = CURS.map((c) => ({ key: c, name: CUR[c].name, cur: c, native: d.byCur[c].native, eur: d.byCur[c].eur, color: CUR[c].color, n: d.byCur[c].n }))
      .filter((x) => x.n && x.eur != null && x.eur > 0.005);
  }
  const sum = items.reduce((s, x) => s + x.eur, 0);
  for (const x of items) x.pct = sum > 0 ? x.eur / sum : 0;
  return { items, sum, total: d.total, by };
}
function arcPath(cx, cy, r, a0, a1) {
  const p = (a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return "M" + x0.toFixed(2) + " " + y0.toFixed(2) + "A" + r + " " + r + " 0 " + large + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2);
}
function allocHtml() {
  const { items, total, by } = allocData();
  if (!items.length) {
    return '<p class="chart-empty">' + (accountsList().length ? "Sobald ein Konto Guthaben hat, siehst du hier, wie sich dein Vermögen verteilt." : "Leg dein erstes Konto an – dann siehst du hier, wie sich dein Vermögen auf Euro, USDT und Bitcoin verteilt.") + "</p>";
  }
  const focus = items.find((x) => x.key === S.ui.chart.focus) || null;
  const R = 80, SW = 22, C = 100;
  const gap = items.length > 1 ? 0.035 : 0;
  let a = -Math.PI / 2;
  let arcs = "";
  for (const x of items) {
    const sweep = x.pct * Math.PI * 2;
    const a0 = a + gap / 2, a1 = a + sweep - gap / 2;
    const label = esc(x.name) + ": " + fmtPct(x.pct * 100) + ", " + fmtEUR(x.eur);
    if (items.length === 1) arcs += '<circle class="arc on" cx="' + C + '" cy="' + C + '" r="' + R + '" fill="none" style="stroke:' + x.color + '" stroke-width="' + SW + '" data-act="alloc-focus" data-key="' + esc(x.key) + '"><title>' + label + "</title></circle>";
    else if (a1 > a0) arcs += '<path class="arc' + (focus && focus.key === x.key ? " on" : "") + '" d="' + arcPath(C, C, R, a0, a1) + '" fill="none" style="stroke:' + x.color + '" stroke-width="' + SW + '" data-act="alloc-focus" data-key="' + esc(x.key) + '"><title>' + label + "</title></path>";
    a += sweep;
  }
  const center = focus
    ? '<span class="l">' + esc(focus.name) + '</span><span class="v">' + fmtEUR(focus.eur, { dec: focus.eur >= 10000 ? 0 : 2 }) + '</span><span class="s">' + fmtPct(focus.pct * 100) + (focus.cur && focus.cur !== "EUR" ? " · " + fmtAmt(focus.native, focus.cur, { max: focus.cur === "BTC" ? 6 : 2 }) : "") + "</span>"
    : '<span class="l">Gesamt</span><span class="v">' + fmtEUR(total, { dec: Math.abs(total) >= 10000 ? 0 : 2 }) + '</span><span class="s">' + items.length + (by === "acc" ? (items.length === 1 ? " Konto" : " Konten") : items.length === 1 ? " Asset" : " Assets") + "</span>";
  const legend = items.map((x) => {
    const sub = by === "acc"
      ? (x.cur === "EUR" ? "Euro" : x.cur ? fmtAmt(x.native, x.cur, { max: x.cur === "BTC" ? 8 : 2 }) : "")
      : (x.cur === "EUR" ? x.n + (x.n === 1 ? " Konto" : " Konten") : fmtAmt(x.native, x.cur, { max: x.cur === "BTC" ? 8 : 2 }));
    return '<button type="button" class="alloc-item" data-act="alloc-focus" data-key="' + esc(x.key) + '" aria-pressed="' + (!!focus && focus.key === x.key) + '">' +
      '<span class="sw" style="background:' + x.color + '"></span><span class="n">' + esc(x.name) + '</span><span class="p">' + fmtPct(x.pct * 100) + "</span>" +
      '<span class="s">' + (sub || "&nbsp;") + '</span><span class="e">' + fmtEUR(x.eur) + "</span></button>";
  }).join("");
  const aria = "Aufteilung deines Vermögens: " + items.map((x) => x.name + " " + fmtPct(x.pct * 100)).join(", ");
  return '<div class="alloc"><div class="alloc-donut' + (focus ? " focus" : "") + '"><svg viewBox="0 0 200 200" role="img" aria-label="' + esc(aria) + '">' +
    '<circle cx="' + C + '" cy="' + C + '" r="' + R + '" fill="none" stroke="var(--panel-2)" stroke-width="' + SW + '"></circle>' + arcs + "</svg>" +
    '<div class="alloc-center">' + center + "</div></div>" +
    '<div class="alloc-legend">' + legend + "</div></div>";
}
