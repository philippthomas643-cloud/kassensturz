    <radialGradient id="ks-halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3a5cff" stop-opacity=".40"/><stop offset=".55" stop-color="#3a5cff" stop-opacity=".07"/><stop offset="1" stop-color="#3a5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="ks-ember" cx=".74" cy=".76" r=".3"><stop offset="0" stop-color="#ff6a2a" stop-opacity=".16"/><stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/></radialGradient>
    <linearGradient id="ks-k" gradientUnits="userSpaceOnUse" x1="260" y1="262" x2="800" y2="762"><stop offset="0" stop-color="#4c7dff"/><stop offset=".5" stop-color="#14e0b0"/><stop offset="1" stop-color="#ff6a2a"/></linearGradient>
